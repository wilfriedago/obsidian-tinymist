name: Release

# Releases follow from Conventional Commits on main.
#
# release-please keeps one release pull request open, with the next version
# worked out from the commit subjects since the last release. Merging it tags
# the release, and the `publish` job builds, attests, attaches the three files
# Obsidian downloads, and publishes.
#
# Everything runs on the default GITHUB_TOKEN. GitHub does not start workflows
# for pushes or pull requests made with that token, so the release pull
# request would never get the required `ci` check on its own. `release-pr`
# therefore starts CI on the release branch itself, through
# `workflow_dispatch`, which is an event that token is allowed to trigger.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Rebuild and re-upload an existing release, e.g. 0.5.0. Leave empty to run release-please.
        required: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # release-please tracks its pull request with `autorelease:` labels.
      issues: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Finishes the release pull request, which release-please regenerates from
  # main every time main moves:
  #
  # - `versions.json` needs a new key per release, and release-please can only
  #   update keys that already exist.
  # - release-please puts its generated section above `## [Unreleased]`
  #   instead of using the prose written there; the fold makes the prose the
  #   release's section and restores the project's heading style.
  #
  # Then it starts CI on the result, which is what the required check reads.
  release-pr:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Find the release branch
        id: pr
        env:
          PR: ${{ needs.release-please.outputs.pr }}
        # Number 0 is release-please reporting that nothing changed.
        run: |
          echo "branch=$(jq -r .headBranchName <<< "$PR")" >> "$GITHUB_OUTPUT"
          echo "number=$(jq -r .number <<< "$PR")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.pr.outputs.number != '0'
        with:
          ref: ${{ steps.pr.outputs.branch }}

      - uses: actions/setup-node@v7
        if: steps.pr.outputs.number != '0'
        with:
          node-version: 24

      - name: Add the versions.json entry and fold the changelog
        if: steps.pr.outputs.number != '0'
        run: |
          node version-bump.mjs
          node scripts/release-changelog.mjs fold
          node scripts/validate-manifest.mjs

      - name: Commit to the release branch
        if: steps.pr.outputs.number != '0'
        run: |
          set -euo pipefail
          git add versions.json manifest.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'The release branch is already complete.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          version="$(node -p "require('./package.json').version")"
          git commit -m "chore: complete the ${version} release"
          git push

      - name: Run CI on the release branch
        if: steps.pr.outputs.number != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  publish:
    needs: release-please
    # `always()` so the manual re-upload path runs while release-please is skipped.
    if: >-
      always() && (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Build plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm run validate:manifest
          pnpm run lint
          pnpm run lint:obsidian
          pnpm run build

      - name: Check the tag matches the manifest
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$manifest_version" ]; then
            echo "Tag $TAG does not match manifest version $manifest_version" >&2
            exit 1
          fi

      - name: Check the release artifacts exist
        run: |
          test -f dist/main.js
          test -f dist/manifest.json
          test -f dist/styles.css

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/styles.css

      - name: Attach the assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Uploaded from dist/, but each asset lands under its basename, which
          # is what Obsidian downloads: main.js, manifest.json, styles.css.
          gh release upload "$TAG" dist/main.js dist/manifest.json dist/styles.css --clobber
          # The release reads like the changelog, not like release-please's
          # generated list.
          node scripts/release-changelog.mjs notes "$TAG" > "$RUNNER_TEMP/notes.md"
          # Published only now, once the assets are attached, so there is never
          # a public release Obsidian cannot install.
          gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --draft=false
