name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # How the release pull request gets its checks: release.yml dispatches this
  # on the release branch, because pushes made with GITHUB_TOKEN start nothing.
  # With no base to diff against, `changes` runs the full suite.
  workflow_dispatch:

# Path filtering is done per job rather than with `on.push.paths-ignore`.
#
# A workflow skipped by `paths-ignore` never reports its checks, and GitHub
# leaves a required check "Pending" forever, so a docs-only pull request would
# be permanently unmergeable.
#
# Gating the jobs is not sufficient on its own either: a skipped matrix job
# collapses to a single `check` result, so the per-version contexts
# `check (20.x)` and friends never exist on that commit — the same deadlock by
# another route. Verified on a real pull request, not assumed.
#
# So the only *required* check is `ci` at the bottom of this file. It always
# runs, and it passes when every other job either succeeded or was skipped.
# Branch protection therefore depends on one stable name that is always
# reported, and the matrix can change without touching repository settings.

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so a pull request can be diffed against its merge base.
          fetch-depth: 0

      - name: Decide whether anything build-relevant changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=0 origin "$BASE_REF" >/dev/null 2>&1 || true
            changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
          else
            # A new branch, a force push, or a missing base: run everything
            # rather than guess. Skipping CI wrongly is far worse than
            # running it needlessly.
            echo 'code=true' >> "$GITHUB_OUTPUT"
            echo 'Could not determine the changed files; running the full suite.'
            exit 0
          fi

          if [ -z "$changed" ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            echo 'No diff resolved; running the full suite.'
            exit 0
          fi

          echo 'Changed files:'
          echo "$changed" | sed 's/^/  /'

          # An allow-list would silently skip CI for any path nobody thought
          # of. This is a deny-list instead: a file only counts as irrelevant
          # if it is explicitly named here, so anything new runs the suite.
          #
          # test-vault/ is deliberately absent — the integration tests compile
          # those fixtures, so changing one must run CI.
          code=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md) ;;
              LICENSE) ;;
              docs/*) ;;
              .github/ISSUE_TEMPLATE/*) ;;
              .github/CODEOWNERS) ;;
              .github/FUNDING.yml) ;;
              .github/dependabot.yml) ;;
              .gitignore | .editorconfig | .npmrc) ;;
              *)
                echo "  -> '$file' affects the build"
                code=true
                break
                ;;
            esac
          done <<< "$changed"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 'false' ]; then
            echo 'Only documentation and repository metadata changed; skipping the build.'
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Validate manifest
        run: pnpm run validate:manifest

      - name: Lint
        run: pnpm run lint

      - name: Lint against the Obsidian review rules
        run: pnpm run lint:obsidian

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        # The Tinymist integration tests skip themselves when no executable is
        # present; they run in the `integration` job below instead.
        run: pnpm run test:unit

      - name: Build
        run: node esbuild.config.mjs production

      - name: Check the release artifacts exist
        run: |
          test -f dist/main.js
          test -f dist/manifest.json
          test -f dist/styles.css

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Exercises the adapter against a real Tinymist, which is the only way to
    # catch a change in its CLI flags, command names, or export argument shape.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install Tinymist
        run: |
          VERSION=0.15.8
          BASE="https://github.com/Myriad-Dreamin/tinymist/releases/download/v${VERSION}"
          ASSET="tinymist-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$ASSET" "$BASE/$ASSET"
          curl -fsSL -o "$ASSET.sha256" "$BASE/$ASSET.sha256"
          # Verify before extracting: CI downloads a binary from the network,
          # and the published checksum is what makes that download accountable.
          sha256sum -c "$ASSET.sha256"
          tar -xzf "$ASSET"
          install -m 0755 "$(find . -name tinymist -type f -perm -u+x | head -n1)" /usr/local/bin/tinymist
          tinymist -V

      - name: Integration tests
        # Fails rather than skips if the executable is missing, so a broken
        # install cannot masquerade as a passing run.
        env:
          TINYMIST_REQUIRED: '1'
        run: pnpm run test:integration

  # The single required status check.
  #
  # `if: always()` is what makes it reliable: it reports whether or not the
  # jobs above ran, which is precisely the property branch protection needs.
  ci:
    name: ci
    needs: [changes, check, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report the overall result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"

          # `skipped` is a pass: it means the filter proved the change cannot
          # affect the build. `failure` and `cancelled` are not.
          if echo "$RESULTS" | grep -qE '"result": *"(failure|cancelled)"'; then
            echo '::error::A required job failed or was cancelled.'
            exit 1
          fi

          echo 'Every job succeeded or was skipped.'
