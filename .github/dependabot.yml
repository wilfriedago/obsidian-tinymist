version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # These move together and are checked by the same CI run, so one pull
      # request per week is easier to review than a dozen.
      codemirror:
        patterns:
          - '@codemirror/*'
          - '@lezer/*'
      dev-tooling:
        patterns:
          - 'oxlint'
          - 'eslint*'
          - 'typescript*'
          - 'vitest'
          - 'esbuild'
          - '@types/*'
          - 'globals'
          - 'jiti'
    ignore:
      # Pinned deliberately: it must match the CodeMirror instance Obsidian
      # itself loads, which is decided by the app, not by this repository.
      - dependency-name: obsidian
    # Titles release-please can read. A runtime dependency ships to users, so
    # its bump is a `fix` and releases a patch; a development one does not.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
